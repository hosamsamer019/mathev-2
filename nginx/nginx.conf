worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone (10 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # API Gateway Server Block
    server {
        listen 80;
        server_name api.saden-math.com localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # HSTS (uncomment when HTTPS is live)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Global Rate Limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Standard Proxy Settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth Service
        location /api/auth/ {
            proxy_pass http://auth-service:4001/;
        }

        # User Service
        location /api/users/ {
            proxy_pass http://user-service:4002/;
        }

        # Course Service
        location /api/courses/ {
            proxy_pass http://course-service:4004/;
        }

        # AI Service
        location /api/ai/ {
            proxy_pass http://ai-service:4003/;
        }

        # Analytics Service
        location /api/analytics/ {
            proxy_pass http://analytics-service:4005/;
        }

        # WebSocket (Socket.IO) handling for Course Service
        location /socket.io/ {
            proxy_pass http://course-service:4004/socket.io/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health Check
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Block Hidden Files
        location ~ /\. {
            deny all;
        }
    }
}
