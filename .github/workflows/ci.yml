name: Pull Request CI Pipeline

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install --include=dev
          npm install --prefix apps/frontend --include=dev

      - name: Build Shared Packages & Database Client
        env:
          DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
          DIRECT_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
        run: |
          npm run build --prefix packages/shared
          npm run build --prefix packages/database

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
          DIRECT_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Frontend Typecheck
        run: npx tsc --noEmit --project apps/frontend/tsconfig.json

      - name: Frontend Build
        run: npm run build --prefix apps/frontend

      - name: Frontend Unit & UI Tests
        run: npm test --prefix apps/frontend

      - name: Backend Services Typecheck
        run: |
          npx tsc --noEmit --project services/auth-service/tsconfig.json
          npx tsc --noEmit --project services/user-service/tsconfig.json
          npx tsc --noEmit --project services/course-service/tsconfig.json
          npx tsc --noEmit --project services/ai-service/tsconfig.json
          npx tsc --noEmit --project services/analytics-service/tsconfig.json
          npx tsc --noEmit --project services/video-worker/tsconfig.json

  docker-build-validation:
    name: Docker Build Validation
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: false
          tags: alsaden/frontend:test

      - name: Build Auth Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/Dockerfile
          build-args: SERVICE_NAME=auth-service
          push: false
          tags: alsaden/auth-service:test

      - name: Build User Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/Dockerfile
          build-args: SERVICE_NAME=user-service
          push: false
          tags: alsaden/user-service:test

      - name: Build Course Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/Dockerfile
          build-args: SERVICE_NAME=course-service
          push: false
          tags: alsaden/course-service:test

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/Dockerfile
          build-args: SERVICE_NAME=ai-service
          push: false
          tags: alsaden/ai-service:test

      - name: Build Analytics Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/Dockerfile
          build-args: SERVICE_NAME=analytics-service
          push: false
          tags: alsaden/analytics-service:test
