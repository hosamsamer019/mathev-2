name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm run install:all

      - name: Lint Frontend
        run: npm run test --prefix apps/frontend
        continue-on-error: false

      - name: TypeScript Check (Services)
        run: |
          npm run build --prefix services/auth-service
          npm run build --prefix services/user-service
          npm run build --prefix services/ai-service
          npm run build --prefix services/course-service
          npm run build --prefix services/analytics-service
          npm run build --prefix services/video-worker
        continue-on-error: false

      - name: Prisma Validation
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

  security-and-regression-tests:
    name: Security & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup test dependencies
        run: npm install axios puppeteer @prisma/client

      - name: Prepare CI Environment
        run: cp .env.example .env

      - name: Start Docker CI Environment
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'while ! curl -f -s http://localhost:80/health > /dev/null; do
            echo "Waiting for http://localhost:80/health..."
            sleep 5
          done'
          echo "Services are ready!"

      - name: Generate Prisma Client (For Tests)
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run E2E Sync Check
        run: node test-e2e-sync.js

      - name: Run Exam Security Regression Tests (Registered)
        run: node test_e2e_registered_exam_security.mjs

      - name: Run Exam Security Regression Tests (External)
        run: node test_e2e_external_exam_security.mjs

      - name: Run Browser Anti-Cheat (Puppeteer)
        run: node test_browser_registered_anti_cheat.mjs

      - name: Run E2E Adversarial Tests
        run: node test_e2e_adversarial.mjs

      - name: Run E2E External Portal Journey
        run: node test_e2e_external_portal_journey.mjs
        
      - name: Run E2E No-IP External Tests
        run: node test_e2e_no_ip_external.mjs

      - name: OWASP ZAP Baseline Scan (Test Environment)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:80'
          fail_action: true

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose logs
