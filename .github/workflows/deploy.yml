name: Production VPS Deployment (Manual Dispatch)

# ==============================================================================
# MANUAL DEPLOYMENT WORKFLOW ONLY
# This workflow is disabled from automatic execution.
# To execute, trigger manually from the GitHub Actions tab after verifying CI passes.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      run_database_migrations:
        description: 'Run Prisma Database Migrations (prisma migrate deploy)'
        required: true
        default: true
        type: boolean

jobs:
  deploy-to-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Connection & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "Starting deployment on VPS..."
            cd /var/www/al-saden

            echo "Pulling latest changes from Git repository..."
            git pull origin main

            echo "Ensuring production environment file exists..."
            if [ ! -f .env.production ]; then
              echo "ERROR: .env.production not found on VPS! Aborting deployment."
              exit 1
            fi

            echo "Building and starting production containers..."
            docker compose -f docker-compose.production.yml --env-file .env.production build
            docker compose -f docker-compose.production.yml --env-file .env.production up -d --remove-orphans

            if [ "${{ github.event.inputs.run_database_migrations }}" = "true" ]; then
              echo "Running Prisma migrations..."
              docker compose -f docker-compose.production.yml --env-file .env.production run --rm prisma-migrate
            fi

            echo "Waiting for services to become healthy..."
            sleep 15
            docker compose -f docker-compose.production.yml ps

            echo "Checking Nginx ingress health..."
            curl -f -s http://localhost:80/health || exit 1

            echo "Deployment completed successfully!"
