name: Production Deployment Pipeline

# ==============================================================================
# SAFE AUTOMATIC & CONTROLLED MANUAL DEPLOYMENT PIPELINE
# - Triggers automatically on push to 'main' AFTER CI validation passes.
# - Triggers manually via workflow_dispatch for targeted deployments & rollbacks.
# - Protected by concurrency group 'production-deployment'.
# - Pull requests run CI only and cannot access deployment secrets or VPS.
# ==============================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      target_commit_sha:
        description: 'Target Commit SHA to Deploy (leave blank for workflow trigger commit)'
        required: false
        default: ''
        type: string
      run_database_migrations:
        description: 'Run Prisma Database Migrations (prisma migrate deploy)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ci-validation:
    name: Lint, Typecheck & Tests Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install --include=dev
          npm install --prefix apps/frontend --include=dev

      - name: Build Shared Packages & Database Client
        env:
          DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
          DIRECT_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
        run: |
          npm run build --prefix packages/shared
          npm run build --prefix packages/database

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
          DIRECT_URL: "postgresql://mock_user:mock_pass@localhost:5432/mock_db"
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Frontend Typecheck
        run: npx tsc --noEmit --project apps/frontend/tsconfig.json

      - name: Frontend Build
        run: npm run build --prefix apps/frontend

      - name: Frontend Unit & UI Tests
        run: npm test --prefix apps/frontend

      - name: Backend Services Typecheck
        run: |
          npx tsc --noEmit --project services/auth-service/tsconfig.json
          npx tsc --noEmit --project services/user-service/tsconfig.json
          npx tsc --noEmit --project services/course-service/tsconfig.json
          npx tsc --noEmit --project services/ai-service/tsconfig.json
          npx tsc --noEmit --project services/analytics-service/tsconfig.json
          npx tsc --noEmit --project services/video-worker/tsconfig.json

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: ci-validation
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Connection & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -e
            echo "================================================================"
            echo "  AL-SADEN PLATFORM: PRODUCTION VPS DEPLOYMENT"
            echo "================================================================"
            
            DEPLOY_DIR="/var/www/al-saden"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deployment directory $DEPLOY_DIR not found on VPS!"
              exit 1
            fi
            
            cd "$DEPLOY_DIR"
            git config --global --add safe.directory "$DEPLOY_DIR"
            
            echo "[1/7] Fetching latest canonical repository state..."
            git fetch origin main
            
            TARGET_COMMIT="${{ github.event.inputs.target_commit_sha }}"
            if [ -z "$TARGET_COMMIT" ]; then
              TARGET_COMMIT="${{ github.sha }}"
            fi
            echo "[2/7] Checking out target commit: $TARGET_COMMIT"
            git checkout "$TARGET_COMMIT"
            
            DEPLOYED_SHA=$(git rev-parse HEAD)
            echo "Verified VPS Git HEAD: $DEPLOYED_SHA"
            
            if [ -n "$TARGET_COMMIT" ] && [ "$DEPLOYED_SHA" != "$TARGET_COMMIT" ] && [ "${TARGET_COMMIT:0:7}" != "${DEPLOYED_SHA:0:7}" ]; then
              echo "ERROR: Git HEAD mismatch! Expected $TARGET_COMMIT but found $DEPLOYED_SHA"
              exit 1
            fi
            
            echo "[3/7] Verifying production environment configuration..."
            if [ ! -f .env.production ]; then
              echo "ERROR: .env.production not found on VPS! Aborting deployment."
              exit 1
            fi
            
            echo "[4/7] Building production containers safely..."
            docker compose -f docker-compose.production.yml --env-file .env.production build
            
            echo "[5/7] Starting services with zero-downtime rolling update..."
            docker compose -f docker-compose.production.yml --env-file .env.production up -d --remove-orphans
            
            echo "Reloading Nginx upstream resolution..."
            docker compose -f docker-compose.production.yml exec -T nginx nginx -s reload || docker restart alsaden-nginx
            
            if [ "${{ github.event.inputs.run_database_migrations }}" = "true" ]; then
              echo "Running Prisma migrations..."
              docker compose -f docker-compose.production.yml --env-file .env.production run --rm prisma-migrate
            else
              echo "Skipping database migrations (run_database_migrations = false)."
            fi
            
            echo "[6/7] Waiting for services to become healthy..."
            sleep 15
            docker compose -f docker-compose.production.yml ps
            
            echo "[7/7] Checking Nginx ingress & PostgreSQL health..."
            curl -f -s http://localhost/health || curl -f -s http://127.0.0.1/health || exit 1
            docker exec alsaden-postgres pg_isready || exit 1
            
            echo "================================================================"
            echo "  DEPLOYMENT SUCCESSFUL — DEPLOYED SHA: $DEPLOYED_SHA"
            echo "================================================================"

  post-deploy-smoke-verification:
    name: Production Smoke Verification
    needs: deploy-to-vps
    runs-on: ubuntu-latest
    steps:
      - name: Verify Public HTTPS & Ingress
        run: |
          echo "Verifying Public HTTPS (https://al-saden.net)..."
          curl -f -s -I https://al-saden.net/ | grep -E "HTTP/.* 200" || exit 1
          
          echo "Verifying API Health (https://al-saden.net/api/health)..."
          curl -f -s -I https://al-saden.net/api/health | grep -E "HTTP/.* 200" || exit 1
          
          echo "Verifying SEO Robots (https://al-saden.net/robots.txt)..."
          curl -f -s https://al-saden.net/robots.txt | grep -E "Sitemap:" || exit 1
          
          echo "Verifying Sitemap (https://al-saden.net/sitemap.xml)..."
          curl -f -s https://al-saden.net/sitemap.xml | grep -E "<urlset" || exit 1
          
          echo "Production Smoke Tests Passed Successfully!"
