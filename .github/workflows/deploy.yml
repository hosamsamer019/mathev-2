name: Production Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # In a real scenario, uncomment and add registry credentials
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Auth Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./services/Dockerfile
        build-args: |
          SERVICE_NAME=auth-service
        push: false # Change to true when registry is configured
        tags: al-saden/auth-service:latest

    - name: Build Course Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./services/Dockerfile
        build-args: |
          SERVICE_NAME=course-service
        push: false
        tags: al-saden/course-service:latest

    # (Repeat for other services: user, ai, analytics, frontend)

  deploy:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Remote Deployment
      run: |
        echo "Docker images built successfully."
        echo "Triggering VPS deployment webhook or SSH command here..."
        # ssh user@vps 'cd /app && docker-compose pull && docker-compose up -d'
