name: E2E Testing (Playwright)

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: alsaden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Enable Corepack & Install dependencies
      run: |
        corepack enable pnpm
        pnpm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: ./apps/frontend

    - name: Setup Database
      env:
        DATABASE_URL: postgresql://prisma:password@localhost:5432/alsaden_test
      run: |
        pnpm --filter @smartmath/database run generate
        npx prisma db push --schema packages/database/prisma/schema.prisma

    - name: Build Platform
      run: pnpm -r run build --if-present

    - name: Run E2E Tests
      env:
        DATABASE_URL: postgresql://prisma:password@localhost:5432/alsaden_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test_jwt_secret
        REFRESH_TOKEN_SECRET: test_refresh_secret
      run: npx playwright test
      working-directory: ./apps/frontend

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: ./apps/frontend/playwright-report/
        retention-days: 30
