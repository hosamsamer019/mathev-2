version: '3.8'

services:
  # ============================================================================
  # Nginx Gateway (Single Public Ingress Point)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: alsaden-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - auth-service
      - user-service
      - course-service
      - ai-service
      - analytics-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # Frontend Application (React + Vite SPA)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: alsaden-frontend
    restart: always
    networks:
      - platform-network
    # Internal only: No host port binding. Nginx proxies requests to frontend:80.

  # ============================================================================
  # Auth Service
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: alsaden-auth-service
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-${REFRESH_TOKEN_SECRET}}
      - CLIENT_URL=${CLIENT_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${CLIENT_URL}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # User Service
  # ============================================================================
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: alsaden-user-service
    environment:
      - NODE_ENV=production
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${CLIENT_URL}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # AI Service (Gemini SDK & Math Solver)
  # ============================================================================
  ai-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ai-service
    container_name: alsaden-ai-service
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=4003
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-${OPENROUTER_KEY:-}}
      - OPENROUTER_KEY=${OPENROUTER_KEY:-${OPENROUTER_API_KEY:-}}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-mistralai/mistral-small-24b-instruct-2501}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-meta-llama/llama-3.3-70b-instruct}
      - OPENROUTER_EMERGENCY_MODEL=${OPENROUTER_EMERGENCY_MODEL:-qwen/qwen-2.5-72b-instruct}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - CLIENT_URL=${CLIENT_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${CLIENT_URL}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # Course Service (Courses, Exams, Homework, Uploads, Payments, Socket.IO)
  # ============================================================================
  course-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: course-service
    container_name: alsaden-course-service
    environment:
      - NODE_ENV=production
      - PORT=4004
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${CLIENT_URL}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PAYMOB_API_KEY=${PAYMOB_API_KEY}
      - FAWRY_MERCHANT_CODE=${FAWRY_MERCHANT_CODE}
      - FAWRY_SECURITY_KEY=${FAWRY_SECURITY_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    volumes:
      - course-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # Analytics Service
  # ============================================================================
  analytics-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: analytics-service
    container_name: alsaden-analytics-service
    environment:
      - NODE_ENV=production
      - PORT=4005
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${CLIENT_URL}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # Video Processing Background Worker (FFmpeg / HLS / BullMQ)
  # ============================================================================
  video-worker:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: video-worker
    container_name: alsaden-video-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - REDIS_URL=${REDIS_URL}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '4G'
        reservations:
          cpus: '0.5'
          memory: '1G'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - platform-network

  # ============================================================================
  # Database Migration Runner (One-Shot Safe Migration)
  # ============================================================================
  prisma-migrate:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: alsaden-prisma-migrate
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=/app/packages/database/prisma/schema.prisma"]
    profiles:
      - tools
    networks:
      - platform-network

  # ============================================================================
  # PostgreSQL Database (Internal Only)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: alsaden-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-math_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-math_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network
    # No public port binding — isolated strictly on platform-network

  # ============================================================================
  # Redis Cache & JTI Session Store (Internal Only)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: alsaden-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network
    volumes:
      - redis-data:/data
    # No public port binding — isolated strictly on platform-network

  # ============================================================================
  # Automated Database Backup Service (Google Drive Off-Site Storage)
  # ============================================================================
  pg-backup:
    image: postgres:15-alpine
    container_name: alsaden-pg-backup
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GDRIVE_CLIENT_ID=${GDRIVE_CLIENT_ID}
      - GDRIVE_CLIENT_SECRET=${GDRIVE_CLIENT_SECRET}
      - GDRIVE_REFRESH_TOKEN=${GDRIVE_REFRESH_TOKEN}
      - GDRIVE_FOLDER_PATH=${GDRIVE_FOLDER_PATH:-AL-SADEN-Backups/PostgreSQL}
      - LOCAL_RETENTION_DAYS=${LOCAL_RETENTION_DAYS:-7}
      - REMOTE_RETENTION_COUNT=${REMOTE_RETENTION_COUNT:-30}
    volumes:
      - ./scripts:/scripts:ro
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache python3 && printenv | grep -E '^(DATABASE_URL|GDRIVE_|LOCAL_RETENTION|REMOTE_RETENTION|BACKUP_DIR|PG|PATH)=' > /container.env && chmod 600 /container.env && echo '0 3 * * * /bin/sh /scripts/pg_backup.sh >> /var/log/cron.log 2>&1' | crontab - && crond -f -d 8"]
    restart: always
    networks:
      - platform-network

networks:
  platform-network:
    name: alsaden-platform-network
    driver: bridge

volumes:
  postgres-data:
    name: alsaden-postgres-data
  redis-data:
    name: alsaden-redis-data
  course-uploads:
    name: alsaden-course-uploads
  postgres-backups:
    name: alsaden-postgres-backups
